name: Publish acodo-template as repository template

# Se publica al subir a main un cambio en la plantilla. La versión sale de su
# `pyproject.toml`; si el repo acodo-template ya tiene la release `vX.Y.Z`, no se repite.
on:
  push:
    branches: [ main ]
    paths:
      - 'packages/acodo-template/**'
  workflow_dispatch: { }

concurrency:
  group: publish-acodo-template
  cancel-in-progress: false

env:
  TARGET_REPO: isidro-rodriguez/acodo-template

jobs:
  check:
    name: Comprobar versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      exists: ${{ steps.meta.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Leer versión y comprobar si ya está publicada
        id: meta
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('packages/acodo-template/pyproject.toml', 'rb'))['project']['version'])")
          TAG="v${VERSION}"
          if gh release view "${TAG}" --repo "${TARGET_REPO}" > /dev/null 2>&1; then
            EXISTS=true
            echo "::warning::${TAG} ya existe en ${TARGET_REPO}: si has cambiado la plantilla, sube la versión en su pyproject.toml."
          else
            EXISTS=false
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "exists=${EXISTS}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publicar plantilla ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Sincronizar workspace
        run: uv sync --all-packages

      - name: Comprobaciones de calidad
        run: uv run --package acodo-cli acodo check

      - name: Construir acodo-template
        run: uv build --package acodo-template

      - name: Actualizar el repositorio de la plantilla
        env:
          PAT: ${{ secrets.TEMPLATE_REPO_PAT }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${PAT}@github.com/${TARGET_REPO}.git" target
          rsync -a --delete --exclude='.git' --exclude='dist/' packages/acodo-template/ target/
          cd target
          # [tool.uv.sources] solo tiene sentido en el workspace: en el repo
          # independiente las dependencias se resuelven desde PyPI.
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = re.sub(r"\[tool\.uv\.sources\]\n(?:.*\n)*?(?=\n\[|\Z)", "", path.read_text())
          path.write_text(text)
          PY
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que subir"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: actualiza la plantilla a ${TAG}"
            git push origin HEAD:main
          fi

      - name: Crear release en el repositorio de la plantilla
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          gh release create "${{ needs.check.outputs.tag }}" dist/* \
            --repo "${TARGET_REPO}" \
            --target main \
            --title "acodo-template ${{ needs.check.outputs.version }}" \
            --generate-notes
