name: Publish acodo-template as repository template

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: { }

jobs:
  build-and-publish-template:
    name: Build, check and publish acodo-template repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install build & tooling
        run: python -m pip install --upgrade pip build twine uv gh

      - name:
          Debug: list env & check secrets
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "Show secret keys presence:"
          if [ -z "${{ secrets.TEMPLATE_REPO_PAT }}" ]; then
            echo "TEMPLATE_REPO_PAT is EMPTY or not set"
          else
            echo "TEMPLATE_REPO_PAT is SET"
          fi
          gh --version || true
          python --version

      - name: Sync uv workspace
        run: uv sync --all-packages

      - name: Run quality checks
        run: uv run --package acodo-cli acodo check

      - name: Build acodo-template
        run: |
          cd packages/acodo-template
          python -m build
          ls -la dist || true

      - name: Prepare TAG env
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name:
          Debug: show dist artifacts
        run: ls -la packages/acodo-template/dist || true

      - name: Authenticate gh CLI (for debug)
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          echo "$GH_TOKEN" > /tmp/token.txt
          # Test gh auth (will fail if token invalid)
          echo "$GH_TOKEN" | gh auth login --with-token || true
          gh auth status || true
          gh api /user --jq '.login' || true

      - name: Update target repository (safe push)
        env:
          PAT: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          set -euo pipefail
          TAG="${TAG}"
          rm -rf target || true
          git clone https://x-access-token:${PAT}@github.com/isidro-rodriguez/acodo-template.git target || true
          if [ ! -d target ]; then
            mkdir target
            cd target
            git init
            git remote add origin https://x-access-token:${PAT}@github.com/isidro-rodriguez/acodo-template.git
            cd ..
          fi
          rsync -a --delete --exclude='.git' packages/acodo-template/ target/
          cd target
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update template to ${TAG}"
            # Try push; capture push output for debugging
            if ! git push origin HEAD:main 2>&1 | tee /tmp/git-push.log; then
              echo "git push failed — possible branch protection or permission error"
              echo "---- git-push.log ----"
              cat /tmp/git-push.log || true
              exit 1
            fi
          fi

      - name: Create release on target repo and upload artifacts
        env:
          PAT: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          TAG="${TAG}"
          gh release create "${TAG}" --repo isidro-rodriguez/acodo-template --title "${TAG}" --notes "Release ${TAG}" || echo "release exists or failed to create"
          for f in packages/acodo-template/dist/*; do
            if [ -f "$f" ]; then
              gh release upload "${TAG}" "$f" --repo isidro-rodriguez/acodo-template --clobber || true
            fi
          done

      - name: Done
        run: |
          echo "acodo-template publish job finished (tag: ${TAG})"
