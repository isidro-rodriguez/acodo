name: Publish acodo-template as repository template

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: { }

jobs:
  build-and-publish-template:
    name: Build, check and publish acodo-template repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build & tooling
        run: python -m pip install --upgrade pip build uv

      - name: Sync uv workspace
        run: uv sync --all-packages

      - name: Run quality checks
        run: uv run --package acodo-cli acodo check

      - name: Build acodo-template
        run: |
          cd packages/acodo-template
          python -m build
          ls -la dist || true

      - name: Prepare TAG env
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Debug - show dist artifacts
        run: ls -la packages/acodo-template/dist || true

      - name: Update target repository (safe push)
        env:
          PAT: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          set -euo pipefail
          TAG="${TAG}"
          rm -rf target || true
          git clone https://x-access-token:${PAT}@github.com/isidro-rodriguez/acodo-template.git target || true
          if [ ! -d target ]; then
            mkdir target
            cd target
            git init
            git remote add origin https://x-access-token:${PAT}@github.com/isidro-rodriguez/acodo-template.git
            cd ..
          fi
          rsync -a --delete --exclude='.git' --exclude='dist/' packages/acodo-template/ target/
          cd target
          # [tool.uv.sources] solo tiene sentido en el workspace: en el repo
          # independiente las dependencias se resuelven desde PyPI.
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("pyproject.toml")
          text = re.sub(r"\[tool\.uv\.sources\]\n(?:.*\n)*?(?=\n\[|\Z)", "", path.read_text())
          path.write_text(text)
          PY
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update template to ${TAG}"
            # Try push; capture push output for debugging
            if ! git push origin HEAD:main 2>&1 | tee /tmp/git-push.log; then
              echo "git push failed — possible branch protection or permission error"
              echo "---- git-push.log ----"
              cat /tmp/git-push.log || true
              exit 1
            fi
          fi

      - name: Create release on target repo and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_PAT }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" packages/acodo-template/dist/* \
            --repo isidro-rodriguez/acodo-template \
            --title "${TAG}" --notes "Release ${TAG}"

      - name: Done
        run: |
          echo "acodo-template publish job finished (tag: ${TAG})"
