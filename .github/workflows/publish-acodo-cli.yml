name: Publish acodo-cli to PyPI

on:
  push:
    tags:
      - 'v*'
  # Descomenta o añade `workflow_dispatch: {}` si quieres poder ejecutarlo manualmente desde la UI
  # workflow_dispatch: {}

jobs:
  build-and-publish:
    name: Build, check and publish acodo-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine uv

      - name: Sync uv workspace
        run: uv sync --all-packages

      - name: Run quality checks
        # corre la comprobación consolidada desde la CLI del workspace
        run: uv run --package acodo-cli acodo check

      - name: Build acodo-cli
        run: |
          cd packages/acodo-cli
          python -m build

      - name: Check package metadata
        run: python -m twine check packages/acodo-cli/dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_ACODO_CLI }}
        run: |
          twine upload packages/acodo-cli/dist/*
