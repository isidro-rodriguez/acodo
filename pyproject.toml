# pyproject.toml
[project]
name = "acodo"
version = "0.4.0"
description = "Utilidades puras del framework Acodo: validación, conversión, parseo y logger."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

# Sin dependencias en tiempo de ejecución: solo biblioteca estándar.
dependencies = []

[project.urls]
Changelog = "https://github.com/isidro-rodriguez/acodo/blob/main/CHANGELOG.md"
Documentation = "https://isidro-rodriguez.github.io/acodo/"
Repository = "https://github.com/isidro-rodriguez/acodo"

[dependency-groups]
dev = [
  "mkdocstrings-python>=2.0.9",
  "pre-commit>=4.7.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "ty>=0.0.89",
  "zensical>=0.0.71",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# --- Cobertura (pytest-cov) --------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "*/tests/*",
  "*/__init__.py",
]

[tool.coverage.report]
exclude_also = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

# --- Poe the Poet (opcional) -------------------------------------------------
# Atajos para quien tenga `poe` instalado globalmente (`uv tool install poethepoet`).
# No es dependencia del proyecto: todo se puede ejecutar también con `uv run`.
[tool.poe]
executor.type = "uv"

[tool.poe.tasks.check]
help = "Formato, lint, tipos y tests (lo mismo que la CI)"
sequence = [
  "ruff format --check .",
  "ruff check .",
  "ty check",
  "pytest",
]
default_item_type = "cmd"

[tool.poe.tasks.fix]
help = "Aplica el formato y las correcciones automáticas de Ruff"
sequence = ["ruff format .", "ruff check --fix ."]
default_item_type = "cmd"

[tool.poe.tasks.cov]
help = "Tests con informe de cobertura"
cmd = "pytest --cov=src --cov-report=term-missing"

[tool.poe.tasks.docs]
help = "Vista previa local de la documentación (Zensical)"
cmd = "zensical serve"

[tool.poe.tasks.docs-build]
help = "Construye la documentación en site/"
cmd = "zensical build"

[tool.poe.tasks.backup]
help = "Copia de seguridad del repositorio con git bundle"
cmd = "python scripts/backup.py"

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "--doctest-modules"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["src", "tests"]

# --- Ruff: formato y linting -------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PERF", "PTH", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["acodo"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# --- ty: comprobación de tipos de Astral -------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.uv.build-backend]
module-name = "acodo"
