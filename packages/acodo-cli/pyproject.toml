[project]
name = "acodo-cli"
version = "0.1.0"
description = "CLI de desarrollo para proyectos Python: calidad, copias, compilado y GitHub App"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "acodo-framework",
    "pyjwt[crypto]>=2.15.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
acodo = "acodo_cli.cli:app"

[tool.uv.sources]
acodo-framework = { workspace = true }

[tool.uv.build-backend]
module-name = "acodo_cli"

[build-system]
requires = ["uv_build>=0.11.7,<0.14.0"]
build-backend = "uv_build"
