# Configuración de Acodo CLI

# Rutas comunes a todos los comandos. Cada sección añade las suyas a estas.
[all]
include = ["scripts/", "src/", "tests/"]
exclude = [".cache/", ".git", ".pytest_cache", ".ruff_cache", ".venv"]

# Adiciones y exclusiones para formateo
[format]
include = []
exclude = []

# Adiciones y exclusiones para lint
[lint]
include = []
exclude = []

# Adiciones y exclusiones para comprobación de tipado
[types]
include = []
exclude = []

# Adiciones y exclusiones para pruebas de pytest
[test]
include = []
exclude = []

# Adiciones y exclusiones para la búsqueda de marcas (TODO, FIXME, XXX, HACK)
[todo]
include = []
exclude = []

# Adiciones y exclusiones para la copia de seguridad
[backup]
include = []
exclude = []
target = ".local/backup.zip" # zip | tar.gz
version_suffix = true

# Adiciones y exclusiones para la documentación de la API
[api]
include = []
exclude = []
target = ".local/api.md" # md
version_suffix = true

[github_app]
config_file = ".local/gh_app.json"
