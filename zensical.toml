# zensical.toml
# Configuración de la documentación de Acodo (Zensical).
# Referencia: https://zensical.org/docs/setup/basics/

[project]
site_name = "Acodo"
site_description = "Framework Python modular sin dependencias innecesarias."
site_author = "isidro-rodriguez"
# GitHub Pages del repositorio (necesario para la navegación instantánea).
site_url = "https://isidro-rodriguez.github.io/acodo/"
repo_url = "https://github.com/isidro-rodriguez/acodo"
repo_name = "isidro-rodriguez/acodo"
copyright = "Copyright &copy; 2026 isidro-rodriguez · Licencia MIT"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/acodo.css"]

# Sin `nav`: el menú se deduce de la estructura de `docs/`; la API la añade el
# plugin `api-autonav` al construir.

# Referencia de la API a partir de los docstrings (estilo Google).
# Requiere `mkdocstrings-python` (grupo de desarrollo).
[project.plugins.api-autonav]
modules = ["src/acodo"]
api_root_uri = "api"
nav_section_title = "API"

[project.plugins.mkdocstrings]
locale = "es"
custom_templates = "docs_templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
show_source = true

[project.theme]
language = "es"
favicon = "assets/images/favicon.png"
logo = "assets/images/logo.png"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Los colores reales (paleta Acodo) están en `docs/assets/stylesheets/acodo.css`.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a la preferencia del sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
